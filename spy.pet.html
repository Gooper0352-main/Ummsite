<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord ID Lookup</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
    }

    input {
      padding: 10px;
      width: 260px;
      border-radius: 5px;
      border: none;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      background: #5865F2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      display: none;
      text-align: left;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      background: #1a1a1a;
      border-radius: 6px;
      white-space: normal;
    }

    .spoiler {
      background: #000;
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .spoiler.revealed {
      color: #fff;
    }

    hr {
      border: 0;
      border-top: 1px solid #333;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h1>Discord ID Lookup</h1>

  <input type="text" id="discordId" placeholder="Enter Discord ID">
  <button onclick="checkID()">Check</button>

  <div id="result"></div>

  <script>
    function isValidDiscordID(id) {
      return /^[0-9]{17,19}$/.test(id);
    }

    function formatMessage(msg) {
      return msg
        .replace(/\n/g, "<br>")
        .replace(/\|\|(.*?)\|\|/g, 
          '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>'
        );
    }

    async function checkID() {
      const id = document.getElementById("discordId").value.trim();
      const resultDiv = document.getElementById("result");

      if (!isValidDiscordID(id)) {
        alert("Invalid Discord ID format!");
        return;
      }

      resultDiv.style.display = "block";
      resultDiv.innerHTML = "Loading...";

      try {
        const response = await fetch("https://gooper.net/spy.json");
        const data = await response.json();

        const userData = data[id];

        if (!userData) {
          resultDiv.innerHTML = "User not found.";
          return;
        }

        const messagesHTML = userData.messages
          .map(msg => `<div class="message">${formatMessage(msg)}</div>`)
          .join("");

        resultDiv.innerHTML = `
          <h2>User Found</h2>
          <p><strong>Server:</strong> ${userData.server}</p>
          <p><strong>User:</strong> ${userData.user} (${id})</p>
          <div>
            <strong>Messages:</strong>
            ${messagesHTML}
          </div>
        `;

      } catch (err) {
        resultDiv.innerHTML = "Failed to fetch data.";
        console.error(err);
      }
    }
  </script>

</body>
</html>

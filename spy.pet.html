<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord Lookup</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
    }

    input {
      padding: 10px;
      width: 300px;
      border-radius: 5px;
      border: none;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      background: #5865F2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      display: none;
      text-align: left;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .entry {
      border-bottom: 1px solid #333;
      padding: 10px 0;
    }

    .message {
      margin-top: 5px;
      padding: 8px;
      background: #1a1a1a;
      border-radius: 6px;
      white-space: pre-wrap;
    }

    .spoiler {
      background: #000;
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .spoiler.revealed {
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>Discord Lookup</h1>
  <h2>Last updated: <span id="lastUpdated"></span></h2>

  <input type="text" id="searchInput" placeholder="Search by ID, Server, User, or Message">
  <button onclick="search()">Search</button>

  <div id="result"></div>

  <script>
    const discordTimestamp = 1774164120;
    const now = Math.floor(Date.now() / 1000);
    const diffSeconds = now - discordTimestamp;

    const hours = Math.floor(diffSeconds / 3600);
    const minutes = Math.floor((diffSeconds % 3600) / 60);

    let relative = "";
    if (hours > 0) {
      relative = hours + " hour" + (hours > 1 ? "s" : "") + " ago";
    } else if (minutes > 0) {
      relative = minutes + " minute" + (minutes > 1 ? "s" : "") + " ago";
    } else {
      relative = "just now";
    }

    document.getElementById("lastUpdated").textContent = relative;

    let data = {};
    let loaded = false;

    async function loadData() {
      const resultDiv = document.getElementById("result");
      try {
        const res = await fetch("https://gooper.net/spy.json");
        data = await res.json();
        loaded = true;
      } catch (err) {
        try {
          const res = await fetch("https://corsproxy.io/?https://gooper.net/spy.json");
          data = await res.json();
          loaded = true;
        } catch (err2) {
          resultDiv.style.display = "block";
          resultDiv.innerHTML = "Failed to load data.";
        }
      }
    }

    loadData();

    function escapeHTML(str) {
      return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatMessage(msg) {
      return escapeHTML(msg)
        .replace(/\|\|(.*?)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
    }

    function search() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';
      resultDiv.style.display = 'block';

      if (!loaded) {
        resultDiv.innerHTML = "Loading data, please wait...";
        return;
      }

      if (!query) {
        resultDiv.innerHTML = "Please enter a search term.";
        return;
      }

      let found = false;

      Object.keys(data).forEach(id => {
        const entry = data[id];
        const serverClean = entry.server.toLowerCase();
        const userClean = entry.user.toLowerCase();
        const messagesCombined = entry.messages.map(m => m.toLowerCase()).join(" ");

        if (
          id.includes(query) ||
          serverClean.includes(query) ||
          userClean.includes(query) ||
          messagesCombined.includes(query)
        ) {
          found = true;

          const messagesHTML = entry.messages
            .map(msg => `<div class="message">${formatMessage(msg)}</div>`)
            .join("");

          resultDiv.innerHTML += `
            <div class="entry">
              <p><strong>ID:</strong> ${id}</p>
              <p><strong>User:</strong> ${entry.user}</p>
              <p><strong>Server:</strong> ${entry.server}</p>
              <div><strong>Messages:</strong>${messagesHTML}</div>
            </div>
          `;
        }
      });

      if (!found) {
        resultDiv.innerHTML = "No matching entries found.";
      }
    }
  </script>

</body>
</html>

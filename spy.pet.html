<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord Lookup</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
    }

    input {
      padding: 10px;
      width: 300px;
      border-radius: 5px;
      border: none;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      background: #5865F2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      display: none;
      text-align: left;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .entry {
      border-bottom: 1px solid #333;
      padding: 10px 0;
    }

    .message {
      margin-top: 5px;
      padding: 8px;
      background: #1a1a1a;
      border-radius: 6px;
      white-space: normal;
    }

    .spoiler {
      background: #000;
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .spoiler.revealed {
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>Discord Lookup</h1>

  <input type="text" id="searchInput" placeholder="Search by ID, Server, or Message">
  <button onclick="search()">Search</button>

  <div id="result"></div>

  <script>
    // Your JSON data
    const data = {
      "919199027575259158": {"server":"Grow a Garden","user":"divine._.retribution","messages":["<:x_cool:1359917738444849375>","no"]},
      "1465668640711118929":{"server":"Official Fortnite","user":"cusenodusedo_29418","messages":["Lol"]},
      "1130809286189125683":{"server":"Geometry Dash","user":"enzokylertv","messages":["JI ROOETOP"]},
      "1442516587314942144":{"server":"jmancurly Universe","user":"cr1stalvr","messages":["Is there a wizherd server or is this it"]}
      // Add all other entries here...
    };

    function formatMessage(msg) {
      return msg
        .replace(/\n/g, "<br>")
        .replace(/\|\|(.*?)\|\|/g, 
          '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>'
        );
    }

    function search() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';
      resultDiv.style.display = 'block';

      if (!query) {
        resultDiv.innerHTML = "Please enter a search term.";
        return;
      }

      let found = false;

      Object.keys(data).forEach(id => {
        const entry = data[id];
        const messagesCombined = entry.messages.join(" ").toLowerCase();

        if (
          id.includes(query) ||
          entry.server.toLowerCase().includes(query) ||
          messagesCombined.includes(query)
        ) {
          found = true;

          const messagesHTML = entry.messages.map(msg => `<div class="message">${formatMessage(msg)}</div>`).join("");

          resultDiv.innerHTML += `
            <div class="entry">
              <p><strong>ID:</strong> ${id}</p>
              <p><strong>User:</strong> ${entry.user}</p>
              <p><strong>Server:</strong> ${entry.server}</p>
              <div><strong>Messages:</strong>${messagesHTML}</div>
            </div>
          `;
        }
      });

      if (!found) {
        resultDiv.innerHTML = "No matching entries found.";
      }
    }
  </script>

</body>
</html>

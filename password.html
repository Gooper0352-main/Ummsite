<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brute Force</title>
<style>
body {
    font-family: monospace;
    background: #111;
    color: rgb(255, 255, 255);
    padding: 20px;
}
input, button {
    margin: 5px 0;
    padding: 8px;
    width: 300px;
}
#log {
    height: 300px;
    overflow-y: scroll;
    border: 1px solid rgb(255, 255, 255);
    padding: 10px;
    white-space: pre-wrap;
}
#result {
    margin-top: 15px;
    border: 1px solid rgb(255, 255, 255);
    padding: 10px;
}
</style>
</head>
<body>

<h3>Enter the password to test</h3>
<input id="target"><br>

<h3>Hint</h3>
<input id="hint"><br>

<button onclick="start()">Start</button>

<div id="log"></div>
<div id="result">PLEASE WAIT FOR RESULT...</div>

<script>
function start() {
    const target = document.getElementById("target").value;
    const hint = document.getElementById("hint").value;

    const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
    let attempts = 0;
    const startTime = performance.now();

    const log = document.getElementById("log");
    const resultBox = document.getElementById("result");

    log.innerHTML = "[*] Starting brute force...\n\n";
    resultBox.innerHTML = "PLEASE WAIT FOR RESULT...";

    function* generate(length) {
        const indices = Array(length).fill(0);
        while (true) {
            yield indices.map(i => chars[i]).join("");
            let i = length - 1;
            while (i >= 0) {
                indices[i]++;
                if (indices[i] < chars.length) break;
                indices[i] = 0;
                i--;
            }
            if (i < 0) return;
        }
    }

    let length = 1;
    let generator = generate(length);

    function step() {
        let res = generator.next();

        if (res.done) {
            length++;
            if (length > 6) {
                resultBox.innerHTML = "[-] NOT FOUND";
                return;
            }
            generator = generate(length);
            res = generator.next();
        }

        const guess = hint + res.value;
        attempts++;

        log.innerHTML += `[${attempts}] Trying: ${guess}\n`;
        log.scrollTop = log.scrollHeight;

        if (guess === target) {
            const time = ((performance.now() - startTime) / 1000).toFixed(2);
            resultBox.innerHTML =
                "[+] PASSWORD FOUND!\n" +
                "[+] Password: " + guess + "\n" +
                "[+] Attempts: " + attempts + "\n" +
                "[+] Time: " + time + "s";
            return;
        }

        setTimeout(step, 0);
    }

    step();
}
</script>

</body>
</html>
